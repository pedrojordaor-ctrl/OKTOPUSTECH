# Hospedagem no Netlify. Site estático: nada para compilar.
# Em outra hospedagem este arquivo é simplesmente ignorado
# (mas o formulário de contato depende do Netlify Forms — ver README).

[build]
  publish = "."

# CSS e JS mantêm o mesmo nome a cada publicação: revalidar sempre,
# senão o navegador fica preso na versão velha.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
