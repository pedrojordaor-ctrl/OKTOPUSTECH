<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="base" cx="45%" cy="40%" r="75%">
      <stop offset="0" stop-color="#0A1022"/>
      <stop offset="1" stop-color="#03050C"/>
    </radialGradient>
    <radialGradient id="luzAzul" cx="12%" cy="-5%" r="45%">
      <stop offset="0" stop-color="#1F5BFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1F5BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B4A" stop-opacity="0"/>
      <stop offset=".35" stop-color="#FF7A45"/>
      <stop offset=".75" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coral2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5A1F" stop-opacity="0"/>
      <stop offset=".3" stop-color="#FF6B2E"/>
      <stop offset=".8" stop-color="#FF6B2E" stop-opacity=".7"/>
      <stop offset="1" stop-color="#FF6B2E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#2F6BFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="brilho" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="brilhoForte" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="pontos" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#4D7BD9"/>
    </pattern>
    <radialGradient id="mascaraPontos" cx="0%" cy="100%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="mp"><rect width="1600" height="900" fill="url(#mascaraPontos)"/></mask>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#luzAzul)"/>
  <rect width="1600" height="900" fill="url(#pontos)" mask="url(#mp)"/>

  <!-- faixas escuras em volta dos arcos -->
  <path d="M1080 -40 C1560 120 1640 620 1250 900 L1600 900 L1600 -40 Z" fill="#050812" opacity=".7"/>
  <path d="M-40 520 C220 700 520 880 900 900 L-40 900 Z" fill="#060A16" opacity=".65"/>

  <!-- arco direito -->
  <path d="M1120 -30 C1560 130 1600 640 1230 910" fill="none" stroke="#FF5A1F" stroke-width="26" opacity=".35" filter="url(#brilhoForte)"/>
  <path d="M1120 -30 C1560 130 1600 640 1230 910" fill="none" stroke="url(#coral)" stroke-width="8" filter="url(#brilho)"/>
  <path d="M1120 -30 C1560 130 1600 640 1230 910" fill="none" stroke="url(#coral)" stroke-width="2.5"/>
  <path d="M1040 -30 C1470 150 1520 620 1160 910" fill="none" stroke="url(#azul)" stroke-width="1.5"/>

  <!-- arco inferior esquerdo -->
  <path d="M-30 560 C230 720 520 870 1000 900" fill="none" stroke="#FF5A1F" stroke-width="22" opacity=".3" filter="url(#brilhoForte)"/>
  <path d="M-30 560 C230 720 520 870 1000 900" fill="none" stroke="url(#coral2)" stroke-width="6" filter="url(#brilho)"/>
  <path d="M-30 560 C230 720 520 870 1000 900" fill="none" stroke="url(#coral2)" stroke-width="2"/>
  <path d="M-30 610 C260 760 560 880 1060 910" fill="none" stroke="url(#azul)" stroke-width="1.2"/>
</svg>
